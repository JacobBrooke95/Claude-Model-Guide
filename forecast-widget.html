<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Claude release forecast (widget)</title>
<!--
  Embeddable summary of release-forecast.html, made for an <iframe> in a daily note.
  Usage, sizes and the Markdown fallback: forecast/WIDGET.md.
  Query options: ?date=YYYY-MM-DD  &theme=light|dark|auto  &voice=0  &compact=1
  Self-contained: the only requests are this site's own forecast files.
-->
<style>
/* Palette copied from forecast/page_template.html (the release-forecast.html palette). */
:root {
  --ink: #333333; --ink-strong: #2d3436; --ink-muted: #8a7565;
  --rule: #f0d9cc; --link: #bc6c5c;
  --mythos: #5b8a9a; --fable: #c09a5b; --opus: #9d7bb0; --sonnet: #d4836a; --haiku: #8fa882;
  --name-mix: 68%;   /* family names are darkened on a light ground so they stay readable as text */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #ece2d8; --ink-strong: #f6eee6; --ink-muted: #a8968a;
  --rule: #4a3c34; --link: #ec8c72;
  --mythos: #7fb0c0; --fable: #d9b475; --opus: #b99ad0; --sonnet: #e79a80; --haiku: #a8c49b;
  --name-mix: 100%; } }
:root[data-theme="dark"] {
  --ink: #ece2d8; --ink-strong: #f6eee6; --ink-muted: #a8968a;
  --rule: #4a3c34; --link: #ec8c72;
  --mythos: #7fb0c0; --fable: #d9b475; --opus: #b99ad0; --sonnet: #e79a80; --haiku: #a8c49b;
  --name-mix: 100%; }

/* No background and no color-scheme: the host note shows through in either theme. */
html, body { margin: 0; padding: 0; background: transparent; }
body { color: var(--ink); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
#w { padding: 2px 1px 0; max-width: 720px; }
a { color: var(--link); text-decoration: none; white-space: nowrap; }
a:hover, a:focus-visible { text-decoration: underline; }

.meta { font-size: 11.5px; color: var(--ink-muted); }
.meta b { color: var(--ink); font-weight: 600; }
.lead { margin: 3px 0 4px; font-size: 14px; color: var(--ink-strong); text-wrap: balance; }
.lead b { font-weight: 700; }
.fam-c { color: var(--c); color: color-mix(in srgb, var(--c) var(--name-mix), #000); }

table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 2px 10px 2px 0; line-height: 1.25; text-align: left; white-space: nowrap; vertical-align: middle; }
thead th { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted);
  border-bottom: 1px solid var(--rule); padding-bottom: 2px; }
tbody th { font-weight: 700; }
tbody tr + tr > * { border-top: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); }
.n { text-align: right; }
td.n { font-weight: 600; color: var(--ink-strong); }
td.n.hi { font-size: 14px; }
.dl { font-size: 10px; font-weight: 600; color: var(--ink-muted); margin-left: 3px; }
.win { width: 100%; min-width: 64px; padding-right: 0; }
.track { position: relative; height: 12px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 5.5px; height: 1px; background: var(--rule); }
.track .yr { position: absolute; top: 2px; height: 8px; width: 1px; background: var(--rule); }
.track .bar { position: absolute; top: 3px; height: 6px; border-radius: 3px; background: var(--c); opacity: .55; }
.track .bar.open { border-radius: 3px 0 0 3px; }
.track .med { position: absolute; top: 0; height: 12px; width: 3px; margin-left: -1.5px; border-radius: 1.5px; background: var(--c); }
tr.axis > * { border-top: 0; padding-top: 0; padding-bottom: 0; }
.ticks { position: relative; height: 12px; font-size: 9.5px; color: var(--ink-muted); }
.ticks span { position: absolute; top: 0; transform: translateX(-50%); }
.ticks span.s { transform: none; }

.voice { margin: 3px 0 0; padding-top: 4px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink); overflow: hidden; }
.voice a { float: right; margin-left: 12px; }
.voice b { font-weight: 600; color: var(--ink-strong); }
.voice .k { color: var(--ink-muted); }
.sep { color: var(--ink-muted); padding: 0 1px; }
.msg { margin: 2px 0; }

.compact .lead { display: none; }
.compact th, .compact td { padding-top: 1.5px; padding-bottom: 1.5px; }
.compact td.n.hi { font-size: 13px; }
.compact table { width: auto; }
.compact th, .compact td { padding-right: 16px; }

@media (max-width: 479px) {
  th, td { padding-right: 7px; }
  .compact th, .compact td { padding-right: 12px; }
  .ticks span.minor, .ticks span.s { display: none; }
}
</style>
</head>
<body>
<div id="w" role="region" aria-label="Claude release forecast" aria-live="polite"></div>
<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var theme = Q.get("theme");
  if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
  var COMPACT = Q.get("compact") === "1", SHOW_VOICE = Q.get("voice") !== "0";
  var DATE = /^\d{4}-\d{2}-\d{2}$/.test(Q.get("date") || "") ? Q.get("date") : null;
  var root = document.getElementById("w");
  if (COMPACT) root.className = "compact";

  var FAMS = ["opus", "sonnet", "haiku", "fable", "mythos"];
  var NAME = { opus: "Opus", sonnet: "Sonnet", haiku: "Haiku", fable: "Fable", mythos: "Mythos" };
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var FULL = "release-forecast.html";
  var LINK = '<a href="' + FULL + '" target="_blank" rel="noopener">Full forecast →</a>';

  // Same rounding as release-forecast.html: (100 * x).toFixed(0) + "%".
  var pct = function (x) { return x == null ? "—" : (100 * x).toFixed(0) + "%"; };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var BASE_YEAR = 2026;  // set from the snapshot's as-of year; the year is written only when a date falls outside it
  // Long and short date forms, as on the page: "Dec 10" / "Jan 19, 2027" and "Feb 16 ’27".
  function fmtD(s) { if (!s) return "—"; if (s[0] === ">") return "after " + fmtD(s.slice(1)); var p = s.split("-").map(Number); return MON[p[1] - 1] + " " + p[2] + (p[0] !== BASE_YEAR ? ", " + p[0] : ""); }
  function fmtS(s) { if (!s) return "—"; if (s[0] === ">") return "later"; var p = s.split("-").map(Number); return MON[p[1] - 1] + " " + p[2] + (p[0] !== BASE_YEAR ? " ’" + String(p[0]).slice(2) : ""); }
  function fmtY(s) { var p = s.split("-").map(Number); return MON[p[1] - 1] + " " + p[2] + ", " + p[0]; }
  function day(s) { return Date.parse(String(s).replace(">", "") + "T12:00:00Z") / 864e5; }

  function getJSON(url) { return fetch(url, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }); }
  // The forecast logs double as the index of snapshots: one row per origin x target x checkpoint.
  function getLog(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(url + " " + r.status); return r.text(); }).then(function (t) {
      var lines = t.trim().split(/\r?\n/), head = lines.shift().split(","), rows = lines.map(function (l) {
        var c = l.split(","), o = {}; head.forEach(function (h, i) { o[h] = c[i]; }); return o;
      });
      var origins = []; rows.forEach(function (r) { if (/^\d{4}-\d{2}-\d{2}$/.test(r.as_of) && origins.indexOf(r.as_of) < 0) origins.push(r.as_of); });
      origins.sort();
      return { rows: rows, origins: origins };
    }).catch(function () { return null; });
  }
  // Change in points against the snapshot before `asOf`, for the same target and the same checkpoint date.
  function delta(log, asOf, target, checkpoint, now, col) {
    if (!log || now == null) return "";
    var prev = log.origins.filter(function (o) { return o < asOf; }).pop();
    if (!prev) return "";
    var row = log.rows.filter(function (r) { return r.as_of === prev && r.target === target && r.checkpoint === checkpoint; })[0];
    var was = row ? parseFloat(row[col]) : NaN;
    if (!isFinite(was)) return "";
    var d = 100 * (now - was);
    if (Math.abs(d) < 3) return "";
    return '<span class="dl" title="' + (d > 0 ? "up" : "down") + " " + Math.abs(d).toFixed(0) + " points since " + fmtD(prev) + '">' + (d > 0 ? "▲" : "▼") + Math.abs(d).toFixed(0) + "</span>";
  }

  // Which snapshot to show. Live: output/. Dated: the newest origin on or before the date.
  function pick(log, kind) {
    var live = "forecast/output/" + kind + ".json", hist = function (d) { return "forecast/history/" + kind + "_" + d + ".json"; };
    if (!DATE) return getJSON(live).then(function (j) { return { data: j, missed: false }; });
    var cands = log ? log.origins.filter(function (o) { return o <= DATE; }).reverse().slice(0, 3) : [DATE];
    var exact = cands[0] === DATE;
    var tryNext = function (i) {
      if (i >= cands.length) return getJSON(live).then(function (j) { return { data: j, missed: true, none: !cands.length }; });
      return getJSON(hist(cands[i])).then(function (j) { return { data: j, missed: !(exact && i === 0) }; }, function () { return tryNext(i + 1); });
    };
    return tryNext(0);
  }

  function familyBlock(F, log) {
    var T = F.targets || {};
    var fams = FAMS.filter(function (f) { return T[f] && T[f].with_signals; });
    if (!fams.length) throw new Error("no family targets");
    var by0 = T[fams[0]].with_signals.by || {};
    var cps = (F.checkpoints && F.checkpoints.length >= 2 ? F.checkpoints : Object.keys(by0).sort().filter(function (d) { return d >= F.as_of; })).slice(0, 2);
    var C1 = cps[0], C2 = cps[1] || cps[0];
    var t = function (f) { return T[f].with_signals; };
    var p = function (f, c) { return (t(f).by || {})[c]; };
    var top = fams.slice().sort(function (a, b) { return (p(b, C2) - p(a, C2)) || (p(b, C1) - p(a, C1)); })[0];

    // Shared time axis for the 80% windows: as-of to the latest q90, held between 6 and 18 months.
    var d0 = day(F.as_of), span = Math.max.apply(null, fams.map(function (f) { return day(t(f).q90) - d0; }));
    span = Math.min(Math.max(span + 6, 180), 548);
    var x = function (s) { return Math.max(0, Math.min(100, 100 * (day(s) - d0) / span)); };
    var ticks = [], a = new Date(F.as_of + "T12:00:00Z"), y = a.getUTCFullYear(), m = a.getUTCMonth();
    for (var i = 1; i < 30; i++) {
      var mm = (m + i) % 12, yy = y + Math.floor((m + i) / 12);
      if (mm % 3) continue;
      var iso = yy + "-" + String(mm + 1).padStart(2, "0") + "-01", pos = 100 * (day(iso) - d0) / span;
      if (pos > 96) break;
      if (pos >= 12) ticks.push({ pos: pos, label: MON[mm] + (mm === 0 ? " ’" + String(yy).slice(2) : ""), jan: mm === 0, minor: mm === 3 || mm === 9 });
    }

    var h = "";
    if (!COMPACT) h += '<p class="lead">Next most likely: <b class="fam-c" style="--c: var(--' + top + ')">' + NAME[top] + "</b> — <b>" + pct(p(top, C2)) + "</b> by " + fmtD(C2) + ", median " + fmtD(t(top).median) + "</p>";
    h += '<table><thead><tr><th scope="col">Next</th><th scope="col" class="n">by ' + fmtD(C1) + "</th>" + (C2 !== C1 ? '<th scope="col" class="n">by ' + fmtD(C2) + "</th>" : "") + '<th scope="col">Median</th>' + (COMPACT ? "" : '<th scope="col" class="win">80% window</th>') + "</tr></thead><tbody>";
    fams.forEach(function (f) {
      var w = t(f), open = String(w.q90)[0] === ">" || day(w.q90) - d0 > span;
      h += '<tr style="--c: var(--' + f + ')"' + (f === top ? ' class="top"' : "") + '><th scope="row" class="fam-c">' + NAME[f] + "</th>" +
        '<td class="n">' + pct(p(f, C1)) + delta(log, F.as_of, f, C1, p(f, C1), "p_model") + "</td>" +
        (C2 !== C1 ? '<td class="n hi">' + pct(p(f, C2)) + delta(log, F.as_of, f, C2, p(f, C2), "p_model") + "</td>" : "") +
        "<td>" + fmtS(w.median) + "</td>";
      if (!COMPACT) {
        var l = x(w.q10), r = x(w.q90), label = "80% window " + fmtS(w.q10) + " – " + fmtS(w.q90) + ", median " + fmtS(w.median);
        h += '<td class="win"><div class="track" role="img" aria-label="' + esc(label) + '" title="' + esc(label) + '">' +
          ticks.filter(function (k) { return k.jan; }).map(function (k) { return '<i class="yr" style="left:' + k.pos.toFixed(1) + '%"></i>'; }).join("") +
          '<i class="bar' + (open ? " open" : "") + '" style="left:' + l.toFixed(1) + "%;width:" + Math.max(r - l, 1.5).toFixed(1) + '%"></i>' +
          (String(w.median)[0] === ">" || day(w.median) - d0 > span ? "" : '<i class="med" style="left:' + x(w.median).toFixed(1) + '%"></i>') + "</div></td>";
      }
      h += "</tr>";
    });
    if (!COMPACT) h += '<tr class="axis" aria-hidden="true"><td colspan="' + (C2 !== C1 ? 4 : 3) + '"></td><td class="win"><div class="ticks"><span class="s" style="left:0">' + MON[m] + "</span>" +
      ticks.map(function (k) { return '<span class="' + (k.minor ? "minor" : "") + '" style="left:' + k.pos.toFixed(1) + '%">' + k.label + "</span>"; }).join("") + "</div></td></tr>";
    return h + "</tbody></table>";
  }

  function voiceLine(V, log, famAsOf) {
    var A = V && V.rungs && V.rungs.A;
    if (!A) return "";
    var K = '<span class="k">Voice model (rung A):</span> ';
    var tag = V.as_of !== famAsOf ? ' <span class="k">(as of ' + fmtD(V.as_of) + ")</span>" : "";
    if (A.resolved) return K + "<b>resolved" + (A.resolution && A.resolution.resolved_date ? " " + fmtD(A.resolution.resolved_date) : "") + "</b>" + tag;
    var hz = (V.horizons || Object.keys(A.by || {}).sort()).filter(function (d) { return A.by && A.by[d] && d >= V.as_of; }).slice(0, 2);
    if (!hz.length) return "";
    var sep = ' <span class="sep">·</span> ';
    return K + hz.map(function (d) {
      return "<b>" + pct(A.by[d].final) + "</b>" + delta(log, V.as_of, "voice_A", d, A.by[d].final, "p_final") + " by " + fmtD(d);
    }).join(sep) + sep + "median " + fmtD(A.median) + tag;
  }

  function fail() { root.innerHTML = '<p class="msg">The forecast could not be loaded just now. ' + LINK + "</p>"; }

  Promise.all([getLog("forecast/forecast_log.csv"), SHOW_VOICE ? getLog("forecast/voice_forecast_log.csv") : null]).then(function (logs) {
    var flog = logs[0], vlog = logs[1];
    // A dated note from before the first voice forecast has no voice line; without the log, try the date's own file.
    var wantVoice = SHOW_VOICE && !(DATE && vlog && !vlog.origins.some(function (o) { return o <= DATE; }));
    return Promise.all([
      pick(flog, "forecast"),
      wantVoice ? pick(vlog, "voice_forecast").catch(function () { return null; }) : null
    ]).then(function (res) {
      var fam = res[0], F = fam.data, voice = res[1];
      BASE_YEAR = +String(F.as_of).slice(0, 4);
      var meta = fam.missed
        ? "<span>No snapshot " + (fam.none ? "on or before " : "for ") + fmtD(DATE) + "; showing <b>" + fmtY(F.as_of) + "</b> · " + esc(F.model_version || "") + "</span>"
        : "<span>Claude releases · as of <b>" + fmtY(F.as_of) + "</b> · " + esc(F.model_version || "") + "</span>";
      // In a dated note the voice line is shown only when it comes from a dated snapshot, never from a later one.
      var v = voice && !(DATE && voice.none) ? voiceLine(voice.data, vlog, F.as_of) : "";
      root.innerHTML = '<div class="meta">' + meta + "</div>" + familyBlock(F, flog) + '<p class="voice">' + v + " " + LINK + "</p>";
    });
  }).catch(fail);
})();
</script>
<noscript><p>Claude release forecast: <a href="release-forecast.html" target="_blank" rel="noopener">Full forecast →</a></p></noscript>
</body>
</html>
